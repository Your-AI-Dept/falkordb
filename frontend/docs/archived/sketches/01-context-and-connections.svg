<title>01 / Attendee + exhibitor: context and connections</title>
<rect width="1600" height="1664" fill="#fafafa"/>
<text x="48" y="60.730000000000004" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#242424">01 / Attendee + exhibitor: context and connections</text>
<text x="48" y="96.94" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#656565">Read each column downward. These journeys happen in parallel; matching rows are not necessarily simultaneous.</text>
