<text x="48" y="60.730000000000004" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#242424">03 / A peer introduction from the same attendee graph</text>
<text x="48" y="96.94" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#656565">Nia is a fictional additional attendee. This branch can happen alongside the booth invitation; neither depends on accepting the other.</text>
