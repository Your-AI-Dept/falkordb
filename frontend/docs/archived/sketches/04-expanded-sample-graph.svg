<text x="70" y="1044.28" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#242424">PEER INTRODUCTION · NIA</text>
<text x="70" y="1086.6" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#242424">Alex → chosen connection with Maya → existing tie to Nia</text>
<text x="70" y="1147.94" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#242424">Add Nia’s relevant launch experience and willingness to help. Ask Alex which topic</text>
<text x="70" y="1172.24" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#242424">would make the conversation useful.</text>
<text x="70" y="1232.28" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#656565">Next: Alex requests → Nia accepts → they meet → each can respond and choose to stay</text>
<text x="70" y="1253.8799999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#656565">connected.</text>
<text x="846" y="1044.28" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#242424">BOOTH INVITATION · REFILLWORKS</text>
<text x="846" y="1086.6" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#242424">Alex → chosen connection with Maya → useful booth visit</text>
<text x="846" y="1147.94" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#242424">Combine with Alex’s stated need, compatible order size, and a specific sample</text>
<text x="846" y="1172.24" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#242424">consultation offered by RefillWorks.</text>
<text x="846" y="1232.28" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#656565">Next: exhibitor invites → Alex accepts → checks in → reports usefulness and optionally shares</text>
<text x="846" y="1253.8799999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#656565">a follow-up.</text>
<text x="48" y="1347.28" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#656565">* The Maya–Nia professional connection is an assumed sample edge, not a verified LinkedIn import. All people, companies, capacities, and outcomes on these boards are fictional.</text>
<text x="48" y="1406.28" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#656565">The social paths help discover candidates. Explicit needs, capabilities, willingness, and availability determine whether an invitation makes sense. Their predictive value still needs testing.</text>
