name: Qodo autofix

# When Qodo reviews a pull request, Claude Code fixes the findings that hold up, runs the checks,
# commits each fix on its own, says on the PR what it fixed or left for a person, and asks Qodo to
# review again. At most 3 rounds per PR, only for branches in this repo; people still merge.
# Needs the ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) secret. Add the "no-autofix" label to opt a PR out.
on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  settle:
    # Qodo posts and then edits its comments; wait until it goes quiet, and let a newer event replace this run
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.state == 'open'
        && github.event.comment.user.type == 'Bot' && contains(github.event.comment.user.login, 'qodo'))
      || (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open'
        && github.event.review.user.type == 'Bot' && contains(github.event.review.user.login, 'qodo'))
    runs-on: ubuntu-latest
    concurrency:
      group: qodo-settle-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - id: pr
        run: echo "number=${{ github.event.issue.number || github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
      - run: sleep 90

  fix:
    needs: settle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: qodo-fix-${{ needs.settle.outputs.pr }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.settle.outputs.pr }}
      MARKER: "<!-- qodo-autofix -->"
    steps:
      - name: Check the pull request and the round cap
        id: gate
        run: |
          info=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,isCrossRepository,headRefName,labels)
          rounds=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))] | length" | awk '{s += $1} END {print s + 0}')
          if [ "$(jq -r .state <<<"$info")" != OPEN ] || [ "$(jq -r .isCrossRepository <<<"$info")" = true ] \
            || jq -e '.labels[] | select(.name == "no-autofix")' <<<"$info" >/dev/null || [ "${rounds:-0}" -ge 3 ]; then
            echo "Skipping: closed, from a fork, opted out, or already $rounds rounds"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "branch=$(jq -r .headRefName <<<"$info")" >> "$GITHUB_OUTPUT"
            echo "round=$(( ${rounds:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.branch }}
          fetch-depth: 0

      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.gate.outputs.go == 'true'
        run: |
          pip install -q -r backend/requirements-dev.txt
          git config user.name "qodo-autofix"
          git config user.email "qodo-autofix@users.noreply.github.com"

      - if: steps.gate.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model sonnet --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git checkout:*),Bash(git revert:*),Bash(cd:*),Bash(pytest:*),Bash(python:*),Bash(npm:*),Bash(npx:*)"
          prompt: |
            You are resolving Qodo's code review on pull request #${{ env.PR }} in ${{ github.repository }},
            round ${{ steps.gate.outputs.round }} of 3. The PR branch is checked out. design_doc.md is the spec.

            1. Read Qodo's newest review: `gh pr view ${{ env.PR }} --comments` and the inline comments from
               `gh api repos/${{ github.repository }}/pulls/${{ env.PR }}/comments`. Only findings from the Qodo bot's
               latest review count. Skip anything already fixed by an earlier "Fix Qodo finding" commit or already answered.
            2. For each finding, decide whether it is correct and worth fixing. Fix only clear, low-risk issues in code this
               PR touches. Leave judgment calls, product or design decisions, and anything outside the PR's scope for a person.
            3. Fix each accepted finding in its own commit titled "Fix Qodo finding: <short title>". No unrelated edits or
               reformatting. Do not push; the workflow pushes after you.
            4. Run the checks for the areas you changed: backend `cd backend && pytest -q`; frontend
               `cd frontend && npm ci && npm test && npm run build`; graph view `cd graph-view && npm ci && npm run lint && npm run build`.
               If a fix breaks a check, undo that commit and list the finding for a person instead.
            5. Write autofix-summary.md at the repo root (do not commit it): one line per finding, saying what you fixed
               (with the commit title) or why you left it for a person. Plain, short sentences.

      - name: Push the fixes, report, and ask Qodo to review again
        if: steps.gate.outputs.go == 'true'
        env:
          BRANCH: ${{ steps.gate.outputs.branch }}
          ROUND: ${{ steps.gate.outputs.round }}
        run: |
          summary=$(cat autofix-summary.md 2>/dev/null || echo "No summary was written.")
          fixes=$(git rev-list --count "origin/$BRANCH..HEAD")
          if [ "$fixes" -gt 0 ]; then
            git push origin "HEAD:$BRANCH"
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          fi
          printf '%s\n**Qodo autofix, round %s of 3:** %s fix commit(s) pushed.\n\n%s\n' "$MARKER" "$ROUND" "$fixes" "$summary" \
            | gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file -
          if [ "$fixes" -gt 0 ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "/agentic_review"
          fi
