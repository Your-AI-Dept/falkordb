name: CI

# Checks every pull request and every push to main, so Qodo's review and the autofix loop have a
# red or green signal to work against.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # the Qodo autofix workflow reruns this after pushing fixes

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:6.0.3
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: "6379"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  graph-view:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graph-view
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: graph-view/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
