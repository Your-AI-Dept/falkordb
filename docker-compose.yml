services:
  falkordb:
    image: falkordb/falkordb:6.0.3  # verified by scripts/probe_falkordb.py
    ports:
      - "6379:6379"  # Redis protocol
      - "3000:3000"  # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      DATA_DIR: /data
      WATCHFILES_FORCE_POLLING: "true"  # --reload on Colima/VM bind mounts
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    depends_on:
      falkordb:
        condition: service_healthy

  frontend:  # Rally attendee and exhibitor app
    image: node:22-alpine
    environment:
      BACKEND_PROXY_TARGET: http://backend:8000
      VITE_DATA_MODE: live  # read and write the backend; running Rally on its own still defaults to fixtures
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  graph-view:  # Event HQ, topic and overview graphs (live from the backend's events)
    image: node:22-alpine
    environment:
      BACKEND_PROXY_TARGET: http://backend:8000
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5174:5174"
    volumes:
      - ./graph-view:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  falkordb-data:
